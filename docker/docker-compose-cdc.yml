version: '3.8'

# ==============================================================================
# Stage 5: Distributed Infrastructure - CDC Lab Environment
# Hệ sinh thái thực hành Change Data Capture (Oracle -> Debezium -> Kafka)
# ==============================================================================

services:
  # 1. Oracle Database XE 21c
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-cdc-source
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-secret}
      - APP_USER=ENTERPRISE_CORE_DB
      - APP_PASSWORD=${APP_PASSWORD:-enterprise_pass}
    healthcheck:
      test: ["CMD", "exit", "0"] # Simplified healthcheck for lab
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cdc-net

  # 2. Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cdc-net

  # 3. Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - cdc-net

  # 4. Debezium Connect (Oracle Connector)
  # Note: Real-world Oracle CDC often requires Oracle Instant Client libraries 
  # mapped into this container or a custom image.
  debezium:
    image: debezium/connect:2.5
    container_name: debezium-connect
    depends_on:
      - kafka
      - oracle-db
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    networks:
      - cdc-net

  # 5. Kafka UI (Visualizing the events)
  kafka-ui:
    image: provectus/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cdc-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - cdc-net

networks:
  cdc-net:
    driver: bridge

volumes:
  oracle-data: