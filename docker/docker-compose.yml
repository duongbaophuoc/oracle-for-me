version: '3.8'

services:
  oracle:
    # Using the official Oracle 21c Express Edition slim image
    # (Sử dụng image Oracle 21c XE bản rút gọn)
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe
    environment:
      - ORACLE_PASSWORD=secret
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    restart: unless-stopped
    # Healthcheck to know when the database is actually ready to accept connections
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oracle-data:
