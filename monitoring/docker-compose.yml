version: '3.8'

# ==============================================================================
# Enterprise Observability Stack for Oracle Database
# Ngăn xếp Giám sát Doanh nghiệp cho CSDL Oracle
# ==============================================================================

services:
  # 1. Prometheus (Time-series metrics database)
  prometheus:
    image: prom/prometheus:latest
    container_name: oracle-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - monitor-net

  # 2. Grafana (Visualization Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: oracle-grafana
    environment:
      # Safe environment variable check: Fails to parse if GRAFANA_ADMIN_PASSWORD is empty or unset
      # (Bảo mật: Trình phân tích docker-compose sẽ báo lỗi chặn ngay lập tức nếu thiếu mật khẩu Grafana)
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Error - GRAFANA_ADMIN_PASSWORD must be defined in your environment or .env file}
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    networks:
      - monitor-net
    depends_on:
      - prometheus

  # 3. Oracle DB Exporter (Connects to Oracle and translates metrics)
  oracledb-exporter:
    image: iamseth/oracledb_exporter:latest
    container_name: oracledb-exporter
    environment:
      # Best Practice: Use dedicated read-only c##monitoring user instead of system.
      # Fails deployment parsing instantly if ORACLE_DSN is not explicitly supplied in env.
      # (Kinh nghiệm thực tế: Dùng tài khoản c##monitoring với quyền đọc tối thiểu và ép truyền biến DSN từ ngoài)
      - DATA_SOURCE_NAME=${ORACLE_DSN:?Error - ORACLE_DSN must be set (e.g. c##monitoring/your_pass@//host.docker.internal:1521/XEPDB1)}
    ports:
      - "9161:9161"
    restart: unless-stopped
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge

volumes:
  grafana-storage:
