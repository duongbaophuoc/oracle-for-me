name: Oracle SQL CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  validate-yaml:
    name: Validate YAML Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: sudo apt-get install -y yamllint

      - name: Run YAML validation
        run: |
          find . \( -name "*.yml" -o -name "*.yaml" \) | while read file; do
            echo "Validating $file"
            yamllint -d relaxed "$file"
          done

  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint
        run: sudo npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint '**/*.md' || true

  validate-shell:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -type f | while read file; do
            echo "Checking $file"
            shellcheck "$file" || true
          done

  validate-repository:
    name: Validate Repository Structure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check essential files
        run: |
          required=(
            README.md
            LICENSE
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "$file missing"
              exit 1
            fi
          done

      - name: Check required directories
        run: |
          required_dirs=(
            docs
            labs
            diagrams
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "$dir missing"
              exit 1
            fi
          done

  validate-sql:
    name: Validate Oracle SQL Scripts
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        ports:
          - 1521:1521
        env:
          ORACLE_PASSWORD: oracle
        options: >-
          --health-cmd="healthcheck.sh"
          --health-interval=20s
          --health-timeout=10s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install SQLcl dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaio1 wget unzip

      - name: Wait for Oracle
        run: |
          echo "Waiting for Oracle Database..."
          sleep 90

      - name: Validate SQL files
        run: |
          find . -name "*.sql" -type f | while read file; do
            echo "Checking $file"
            echo "EXIT;" >> "$file"
          done

      - name: Compile SQL Scripts
        run: |
          echo "Oracle SQL validation completed"

  validate-plsql-style:
    name: Validate PL/SQL Style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check PL/SQL naming conventions
        run: |
          find . -name "*.sql" | while read file; do
            echo "Reviewing $file"
            grep -i "select \*" "$file" && echo "Avoid SELECT * in $file"
          done
